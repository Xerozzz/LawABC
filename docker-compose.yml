services:
  db:
    image: postgres:16-alpine
    container_name: lawabc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawabc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawabc_password}
      POSTGRES_DB: ${POSTGRES_DB:-lawabc}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawabc} -d ${POSTGRES_DB:-lawabc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: lawabc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-lawabc}:${POSTGRES_PASSWORD:-lawabc_password}@db:5432/${POSTGRES_DB:-lawabc}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: lawabc-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    command: npm run dev -- --host

volumes:
  db_data:
