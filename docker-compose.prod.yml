# Production stack: Caddy (edge) -> app (Express serving React + API) -> Postgres.
# Single origin, no CORS. Bring up on a server with:
#   docker compose -f docker-compose.prod.yml up -d --build
# Configuration comes from a .env file next to this one (see .env.prod.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clearair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clearair}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearair} -d ${POSTGRES_DB:-clearair}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-clearair}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clearair}
      DEMO_SEED: ${DEMO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
